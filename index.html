<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Personal Workbench | 个人工作台</title>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Noto+Sans+SC:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --sky-blue: #70B4E8;
      --sky-light: #EBF4FC;
      --pastel-pink: #FFC0D3;
      --pastel-pink-light: #FFF0F4;
      --text-main: #2C3E50;
      --text-muted: #6C7A89;
      --bg-gradient: linear-gradient(135deg, #EBF4FC 0%, #FFF0F4 100%);
      --white-card: rgba(255, 255, 255, 0.92);
      --shadow: 0 8px 30px rgba(112, 180, 232, 0.12);
      --border-radius: 20px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Plus Jakarta Sans', 'Noto Sans SC', sans-serif;
      background: var(--bg-gradient);
      color: var(--text-main);
      min-height: 100vh;
      padding: 30px 20px;
      line-height: 1.6;
    }

    .container {
      max-width: 1100px;
      margin: 0 auto;
    }

    /* Header & Profile */
    header {
      background: var(--white-card);
      border-radius: var(--border-radius);
      padding: 35px;
      box-shadow: var(--shadow);
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 20px;
      align-items: center;
      margin-bottom: 30px;
      border: 2px solid #FFFFFF;
    }

    .profile-info h1 {
      font-size: 2.2rem;
      color: #3498DB;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .profile-info h1 span.cn {
      font-size: 1.2rem;
      color: var(--pastel-pink);
      font-weight: 500;
    }

    .quote-box {
      background: var(--pastel-pink-light);
      border-left: 4px solid var(--pastel-pink);
      padding: 12px 18px;
      border-radius: 10px;
      margin-top: 15px;
      font-weight: 600;
      color: #D81B60;
    }

    .icons-bar {
      display: flex;
      gap: 15px;
      font-size: 1.6rem;
      margin-top: 15px;
    }

    /* Music Player */
    .music-card {
      background: linear-gradient(135deg, #70B4E8, #FFC0D3);
      padding: 25px;
      border-radius: var(--border-radius);
      color: white;
      text-align: center;
      box-shadow: var(--shadow);
    }

    .music-card h3 {
      font-size: 1.1rem;
      margin-bottom: 5px;
    }

    .music-input {
      width: 100%;
      padding: 8px 12px;
      border-radius: 8px;
      border: none;
      margin-top: 10px;
      font-size: 0.85rem;
    }

    /* Layout Grid */
    .grid-2 {
      display: grid;
      grid-template-columns: 2fr 1fr;
      gap: 30px;
    }

    @media (max-width: 850px) {
      header, .grid-2 {
        grid-template-columns: 1fr;
      }
    }

    .card {
      background: var(--white-card);
      border-radius: var(--border-radius);
      padding: 28px;
      box-shadow: var(--shadow);
      margin-bottom: 30px;
      border: 1px solid rgba(255,255,255,0.8);
    }

    .card-title {
      font-size: 1.3rem;
      color: #2980B9;
      margin-bottom: 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .card-title .cn {
      font-size: 0.95rem;
      color: var(--text-muted);
      font-weight: 400;
    }

    /* Schedule & Checklist */
    .routine-list, .travel-list {
      list-style: none;
    }

    .routine-item, .travel-item {
      background: var(--sky-light);
      padding: 15px;
      border-radius: 12px;
      margin-bottom: 12px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      transition: all 0.3s ease;
    }

    .routine-item:hover {
      transform: translateY(-2px);
      background: #E1F0FA;
    }

    .travel-item {
      background: var(--pastel-pink-light);
    }

    .tag {
      background: white;
      padding: 4px 10px;
      border-radius: 20px;
      font-size: 0.8rem;
      font-weight: 600;
      color: var(--sky-blue);
    }

    .tag.pink {
      color: #E91E63;
    }

    /* Pomodoro Timer */
    .timer-display {
      font-size: 2.5rem;
      font-weight: 700;
      text-align: center;
      color: var(--sky-blue);
      margin: 15px 0;
    }

    .btn {
      background: var(--sky-blue);
      color: white;
      border: none;
      padding: 10px 20px;
      border-radius: 25px;
      cursor: pointer;
      font-weight: 600;
      width: 100%;
      transition: opacity 0.2s;
    }

    .btn:hover {
      opacity: 0.9;
    }

    /* Notes Area */
    textarea {
      width: 100%;
      height: 120px;
      border: 2px solid var(--sky-light);
      border-radius: 12px;
      padding: 12px;
      font-family: inherit;
      resize: vertical;
      outline: none;
    }

    textarea:focus {
      border-color: var(--sky-blue);
    }

    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 15px;
    }
