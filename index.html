<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kieu Trinh's Personal Workbench | 个人工作台</title>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Noto+Sans+SC:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --sky-blue: #5BA4E6;
      --sky-light: #EBF4FC;
      --pastel-pink: #FFB3C6;
      --pastel-pink-light: #FFF0F4;
      --text-main: #2C3E50;
      --text-muted: #6C7A89;
      --bg-gradient: linear-gradient(135deg, #EBF4FC 0%, #FFF0F4 100%);
      --white-card: rgba(255, 255, 255, 0.95);
      --shadow: 0 10px 30px rgba(91, 164, 230, 0.12);
      --border-radius: 20px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Plus Jakarta Sans', 'Noto Sans SC', sans-serif;
      background: var(--bg-gradient);
      color: var(--text-main);
      min-height: 100vh;
      padding: 30px 20px;
      line-height: 1.6;
    }

    .container { max-width: 1100px; margin: 0 auto; }

    header {
      background: var(--white-card);
      border-radius: var(--border-radius);
      overflow: hidden;
      box-shadow: var(--shadow);
      margin-bottom: 30px;
      border: 2px solid #FFFFFF;
    }

    .banner-img {
      width: 100%;
      height: 220px;
      object-fit: cover;
    }

    .header-body {
      padding: 30px;
      display: grid;
      grid-template-columns: 1fr 320px;
      gap: 25px;
      align-items: center;
    }

    .profile-info h1 {
      font-size: 2.2rem;
      color: #3498DB;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .profile-info h1 span.cn {
      font-size: 1.2rem;
      color: var(--pastel-pink);
      font-weight: 500;
    }

    .quote-box {
      background: var(--pastel-pink-light);
      border-left: 4px solid var(--pastel-pink);
      padding: 12px 18px;
      border-radius: 10px;
      margin-top: 15px;
      font-weight: 600;
      color: #D81B60;
    }

    .icons-bar {
      display: flex;
      gap: 12px;
      font-size: 1.6rem;
      margin-top: 15px;
    }

    /* Interactive Music Player */
    .music-card {
      background: linear-gradient(135deg, #70B4E8, #FFC0D3);
      padding: 20px;
      border-radius: var(--border-radius);
      color: white;
      text-align: center;
      box-shadow: var(--shadow);
    }

    .music-input-group {
      display: flex;
      gap: 8px;
      margin-top: 10px;
    }

    .music-input {
      flex: 1;
      padding: 8px 12px;
      border-radius: 8px;
      border: none;
      font-size: 0.8rem;
      outline: none;
    }

    .music-btn {
      background: white;
      color: #3498DB;
      border: none;
      padding: 8px 14px;
      border-radius: 8px;
      font-weight: 700;
      cursor: pointer;
      font-size: 0.8rem;
    }

    .player-container {
      margin-top: 12px;
      width: 100%;
      height: 150px;
      border-radius: 12px;
      overflow: hidden;
      background: rgba(0,0,0,0.1);
      display: none;
    }

    .player-container iframe {
      width: 100%;
      height: 100%;
      border: none;
    }

    /* Grid Layout */
    .grid-2 {
      display: grid;
      grid-template-columns: 2fr 1fr;
      gap: 30px;
    }

    @media (max-width: 850px) {
      .header-body, .grid-2 { grid-template-columns: 1fr; }
    }

    .card {
      background: var(--white-card);
      border-radius: var(--border-radius);
      padding: 28px;
      box-shadow: var(--shadow);
      margin-bottom: 30px;
      border: 1px solid rgba(255,255,255,0.8);
    }

    .card-title {
      font-size: 1.3rem;
      color: #2980B9;
      margin-bottom: 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .card-title .cn {
      font-size: 0.95rem;
      color: var(--text-muted);
      font-weight: 400;
    }
